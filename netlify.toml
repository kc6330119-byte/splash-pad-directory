[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.9"

# --- 301 Redirects for broken/removed pages ---

[[redirects]]
  from = "/pad/hathaway-park-winston-salem.html"
  to = "/state/north-carolina"
  status = 301

[[redirects]]
  from = "/pad/hathaway-park-winston-salem"
  to = "/state/north-carolina"
  status = 301

[[redirects]]
  from = "/pad/woodside-lake-park-streetsboro.html"
  to = "/state/ohio"
  status = 301

[[redirects]]
  from = "/pad/woodside-lake-park-streetsboro"
  to = "/state/ohio"
  status = 301

# --- 301 redirects: .html URLs → extensionless canonical URLs ---
# force = true is required because Netlify otherwise serves the .html file
# directly (bypassing redirect rules) when the file physically exists in dist.

[[redirects]]
  from = "/pad/*.html"
  to = "/pad/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/state/*.html"
  to = "/state/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/category/*.html"
  to = "/category/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*.html"
  to = "/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/city/*.html"
  to = "/city/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/submit.html"
  to = "/submit"
  status = 301
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/splash-pad-guide.html"
  to = "/splash-pad-guide"
  status = 301
  force = true

# --- Clean URL rewrites (serve .html files at extensionless paths) ---

[[redirects]]
  from = "/pad/*"
  to = "/pad/:splat.html"
  status = 200

[[redirects]]
  from = "/state/*"
  to = "/state/:splat.html"
  status = 200

[[redirects]]
  from = "/category/*"
  to = "/category/:splat.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat.html"
  status = 200

[[redirects]]
  from = "/city/*"
  to = "/city/:splat.html"
  status = 200

# --- Pretty URL rewrites for static pages ---

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/submit"
  to = "/submit.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/splash-pad-guide"
  to = "/splash-pad-guide.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success/index.html"
  status = 200

[[redirects]]
  from = "/success/"
  to = "/success/index.html"
  status = 200
